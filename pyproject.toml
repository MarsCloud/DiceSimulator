[project]
name = "dice-simulator"
version = "0.1.0"
description = "基于 AST 的安全、分步展示的掷骰模拟引擎（AST-based secure step-by-step dice rolling engine）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
